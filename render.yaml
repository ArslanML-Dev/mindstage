databases:
  - name: mindstage-db
    databaseName: mindstage
    user: mindstage
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: mindstage-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mindstage-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # paste it in the Render dashboard
      - key: CORS_ORIGINS
        value: "*"
